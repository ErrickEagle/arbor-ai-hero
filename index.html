<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arbor AI</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #2b2f38;
    --ink: #f4f5f8;
    --muted: #c3c7d2;
    --line: rgba(255, 255, 255, 0.16);
    --glass: rgba(30, 33, 41, 0.45);
    --lav: #cbb9ff;
    --black: #0d0e12;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--ink); font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a, button { color: inherit; text-decoration: none; font: inherit; }

  .hero {
    position: relative; height: 100svh; min-height: 640px; overflow: hidden; isolation: isolate;
    background:
      radial-gradient(70% 60% at 50% 42%, #5d636f 0%, #444955 38%, #2d3139 72%, #1f2228 100%);
  }
  /* diagonal light beams from the top right, like a studio light */
  .rays { position: absolute; inset: -20%; z-index: -3; pointer-events: none; mix-blend-mode: screen; }
  .rays i {
    position: absolute; top: -10%; width: 14vw; height: 150%; transform-origin: top center;
    background: linear-gradient(to bottom, rgba(255,255,255,.22), rgba(255,255,255,0) 75%);
    filter: blur(28px); animation: beam 9s ease-in-out infinite alternate;
  }
  .rays i:nth-child(1) { right: 22%; transform: rotate(38deg); }
  .rays i:nth-child(2) { right: 10%; width: 8vw; transform: rotate(32deg); animation-delay: -3s; opacity: .7; }
  .rays i:nth-child(3) { right: 34%; width: 6vw; transform: rotate(44deg); animation-delay: -6s; opacity: .5; }
  @keyframes beam { from { opacity: .35; } to { opacity: .9; } }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: -2; }
  .hero::after {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(120% 90% at 50% 40%, transparent 60%, rgba(18,20,25,.7) 100%),
      linear-gradient(to top, rgba(20,22,28,.65) 0%, transparent 35%);
  }

  /* NAV */
  nav { position: absolute; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 18px 32px; }
  .links { display: flex; gap: 28px; font-size: 14px; }
  .links a { color: #e6e8ee; transition: color .2s; }
  .links a:hover { color: #fff; }

  /* letter roll: each letter slides up and its copy rises from below, one after another */
  .roll { display: inline-flex; }
  .roll .ch { display: inline-block; overflow: hidden; height: 1.25em; line-height: 1.25em; }
  .roll .ch > span { display: block; transition: transform .45s cubic-bezier(.6, 0, .2, 1); transition-delay: calc(var(--i) * 28ms); }
  .roll .ch > span::after { content: attr(data-c); display: block; }
  @media (hover: hover) {
    .roll:hover .ch > span { transform: translateY(-50%); }
  }
  @media (prefers-reduced-motion: reduce) { .roll .ch > span { transition: none; } }
  .links.right { justify-content: flex-end; align-items: center; }
  .logo { display: flex; align-items: center; gap: 10px; font: 400 15px/1 "Jost", sans-serif; letter-spacing: .32em; text-transform: uppercase; }
  .logo::before, .logo::after { content: ""; width: 48px; height: 1px; background: var(--line); }
  /* lines draw outward from the wordmark once the page reveals */
  .logo::before, .logo::after { transform: scaleX(0); animation: drawLine .9s cubic-bezier(.6, 0, .2, 1) .7s forwards; }
  .logo::before { transform-origin: right; }   /* left line: right to left */
  .logo::after { transform-origin: left; }     /* right line: left to right */
  .hero.loading .logo::before, .hero.loading .logo::after { animation-play-state: paused; }
  @keyframes drawLine { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .logo::before, .logo::after { animation: none; transform: none; } }

  .btn { display: inline-flex; align-items: center; gap: 10px; font: 400 14px/1 "Geist", sans-serif; padding: 14px 20px; border-radius: 2px; border: 1px solid transparent; cursor: pointer; transition: background .25s, color .25s, border-color .25s, transform .25s cubic-bezier(.2,.8,.2,1); white-space: nowrap; }
  .btn:hover { transform: translateY(-2px); }
  .btn-dark { background: var(--black); color: #fff; }
  .btn-dark:hover { background: #000; }
  .btn-line { position: relative; overflow: hidden; isolation: isolate; border-color: rgba(255,255,255,.55); background: rgba(255,255,255,.04); color: #fff; transition: background .35s, border-color .35s, backdrop-filter .35s, -webkit-backdrop-filter .35s; }
  .btn-line:hover { transform: none; background: rgba(255,255,255,.08); border-color: #fff; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .btn-line canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
  .btn svg { width: 15px; height: 15px; }

  /* arrow hover: the right arrow leaves through the right edge, a new one slides in on the left, label shifts over */
  .btn-arrow { position: relative; overflow: hidden; }
  .btn-arrow:hover { transform: none; background: var(--black); }
  .btn-arrow .arw { display: inline-flex; transition: transform .45s cubic-bezier(.6, 0, .2, 1); }
  .btn-arrow .lbl { transition: transform .45s cubic-bezier(.6, 0, .2, 1); }
  .btn-arrow .arw-in { position: absolute; left: 20px; top: 50%; transform: translate(-44px, -50%); }
  @media (hover: hover) {
    .btn-arrow:hover .lbl { transform: translateX(25px); }
    .btn-arrow:hover .arw-out { transform: translateX(44px); }
    .btn-arrow:hover .arw-in { transform: translate(0, -50%); }
  }

  /* side words */
  .word { position: absolute; top: 46%; transform: translateY(-50%); font: 300 clamp(30px, 4.3vw, 64px)/1 "Jost", sans-serif; letter-spacing: .02em; text-transform: uppercase; pointer-events: none; }
  .word.l { left: 32px; } .word.r { right: 32px; text-align: right; }
  .word > span { display: inline-flex; }
  .word .lt { display: inline-block; white-space: pre; }

  /* bottom */
  .tags { display: grid; grid-template-columns: repeat(3, max-content); gap: 8px; width: max-content; } /* only as wide as its buttons, so it never covers the slider */
  .tags button { font-size: 13px; padding: 9px 14px; color: #e6e8ee; background: rgba(20,22,28,.45); border: 1px solid rgba(255,255,255,.08); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); cursor: pointer; text-align: left; transition: background .25s, border-color .25s, color .25s; }
  .tags button { position: relative; overflow: hidden; isolation: isolate; }
  .tags button canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
  .tags button:hover { background: rgba(255,255,255,.08); color: #fff; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  /* selected fill: white wipes in from the left; the previous tag empties back to the left */
  .tags button::before { content: ""; position: absolute; inset: 0; z-index: -1; background: rgba(255,255,255,.94); transform: scaleX(0); transform-origin: left; transition: transform .55s cubic-bezier(.65, 0, .25, 1); }
  .tags button.on::before { transform: scaleX(1); }
  .tags button.on, .tags button.on:hover { color: var(--black); border-color: rgba(255,255,255,.3); transition: color .3s ease .2s, border-color .3s; }
  @media (prefers-reduced-motion: reduce) { .tags button::before { transition: none; } }
  .bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 32px 32px; pointer-events: none; }
  .bottom > * { pointer-events: auto; }
  .ctas { display: flex; gap: 10px; }

  /* shape slider */
  .shape-ui { position: absolute; left: 0; right: 0; margin: 0 auto; width: max-content; bottom: 40px; z-index: 5; display: flex; padding: 0 8px; background: rgba(20,22,28,.5); border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .dots { display: flex; gap: 0; }
  .dots button { width: 30px; height: 38px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  .dots button::before { content: ""; width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.3); transition: background .3s, transform .3s; }
  .dots button:hover::before { background: rgba(255,255,255,.7); }
  .dots button.on::before { transform: scaleX(3); background: #fff; } /* stretch with transform, not width */

  /* reveal */
  .hero.loading .rv { animation-play-state: paused; }
  .rv { opacity: 0; filter: blur(14px); transform: translateY(14px); animation: rv 1.1s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d, 0s); }
  .word.rv { transform: translateY(-50%) translateY(14px); }
  @keyframes rv { to { opacity: 1; filter: blur(0); transform: none; } }
  .word.rv { animation-name: rvw; }
  @keyframes rvw { to { opacity: 1; filter: blur(0); transform: translateY(-50%); } }

  /* custom cursor */
  .cursor, .cursor-dot { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 50; border-radius: 50%; transform: translate(-50%, -50%); opacity: 0; transition: opacity .3s, width .3s, height .3s, border-color .3s; }
  .cursor { width: 30px; height: 30px; border: 1.5px solid rgba(255,255,255,.9); }
  .cursor-dot { width: 7px; height: 7px; background: #fff; }
  .cursor.big { width: 54px; height: 54px; border-color: var(--lav); }
  @media (pointer: fine) {
    .hero, .hero * { cursor: none !important; }
    .hero:hover .cursor, .hero:hover .cursor-dot { opacity: 1; }
  }

  @media (max-width: 860px) {
    nav { grid-template-columns: auto 1fr; padding: 14px 16px; }
    .links.left { display: none; }
    .links.right { gap: 6px; }
    .links.right .btn { padding: 10px 12px; font-size: 13px; }
    .links.right .btn svg, .links.right .btn .arw { display: none; }
    .logo { justify-self: start; }
    .logo::before, .logo::after { display: none; }
    .word { top: auto; transform: none; font-size: clamp(26px, 8.5vw, 40px); }
    .word.l { left: 16px; bottom: 268px; } .word.r { right: 16px; bottom: 226px; }
    .bottom { padding: 0 16px 20px; }
    .tags { grid-template-columns: repeat(2, 1fr); gap: 6px; width: auto; }
    .tags button { font-size: 12px; padding: 9px 8px; text-align: center; }
    .shape-ui { display: none; }
  }
  /* tablets in portrait: desktop-sized shape buttons */
  @media (min-width: 600px) and (max-width: 860px) {
    .tags { grid-template-columns: repeat(3, max-content); width: max-content; gap: 8px; }
    .tags button { font-size: 13px; padding: 9px 14px; text-align: left; }
  }
  /* very narrow phones */
  @media (max-width: 360px) {
    .links.right .btn { padding: 9px 10px; font-size: 12px; }
    .logo { letter-spacing: .22em; font-size: 13px; }
    .tags button { font-size: 11px; padding: 8px 6px; }
  }
  /* short portrait phones: tap the background to switch shapes */
  @media (max-width: 860px) and (max-height: 700px) and (orientation: portrait) {
    .hero { min-height: 0; }
    .tags { display: none; }
    .word.l { bottom: 112px; } .word.r { bottom: 72px; }
  }
  /* phones in landscape */
  @media (max-height: 500px) and (orientation: landscape) {
    .hero { min-height: 0; }
    nav { padding: 10px 16px; }
    .links.left { display: none; }
    .tags { display: none; }
    .shape-ui { display: none; }
    .word { top: 50%; bottom: auto; transform: translateY(-50%); font-size: clamp(24px, 4vw, 40px); }
    .word.l { left: 16px; bottom: auto; } .word.r { right: 16px; bottom: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .rv { animation-duration: .01s; animation-delay: 0s !important; }
    .rays i { animation: none; }
  }
</style>
</head>
<body>
<section class="hero loading" id="hero">
  <div class="rays" aria-hidden="true"><i></i><i></i><i></i></div>
  <canvas id="gl"></canvas>

  <nav>
    <div class="links left rv" style="--d:.2s"><a class="roll" href="#">Platform</a><a class="roll" href="#">Agents</a><a class="roll" href="#">Pricing</a></div>
    <a class="logo rv" style="--d:.3s" href="#">Arbor</a>
    <div class="links right ctas rv" style="--d:.4s">
      <a class="btn btn-dark btn-arrow" href="#">
        <span class="arw arw-in" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="lbl">Start free</span>
        <span class="arw arw-out" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </a>
      <a class="btn btn-line" href="#">Watch the demo</a>
    </div>
  </nav>

  <div class="word l"><span id="wordL"></span></div>
  <div class="word r"><span id="wordR"></span></div>

  <div class="shape-ui rv" style="--d:1.3s" role="tablist" aria-label="Background shape">
    <span class="dots" id="dots"></span>
  </div>

  <div class="bottom">
    <div class="tags rv" style="--d:1.1s" id="tags"></div>
  </div>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursorDot"></div>
</section>

<script type="module">
import * as THREE from "three";

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const hero = document.getElementById("hero");
const canvas = document.getElementById("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: true, premultipliedAlpha: true, powerPreference: "high-performance" });
renderer.setClearColor(0x000000, 0);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
const WATER = -1.7;
// pure additive (ONE, ONE): shader outputs premultiplied light, so dots brighten the grey page
const ADD = { blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneFactor, blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneFactor };
const N = 56000;

/* ---------------- helpers ---------------- */
const rnd = Math.random;
const gauss = () => (rnd() + rnd() + rnd() + rnd() - 2) / 2; // ~[-1,1], bell shaped
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;

function inSphere(r, bias = 0.35) { // point in a ball, biased toward the surface
  const u = rnd() * 2 - 1, th = rnd() * TAU, s = Math.sqrt(1 - u * u), k = r * Math.pow(rnd(), bias);
  return [s * Math.cos(th) * k, u * k, s * Math.sin(th) * k];
}
function capsule(out, a, b, r, n, bias = 0.35) {
  for (let i = 0; i < n; i++) {
    const t = rnd(), o = inSphere(r, bias);
    out.push(lerp(a[0], b[0], t) + o[0], lerp(a[1], b[1], t) + o[1], lerp(a[2], b[2], t) + o[2]);
  }
}
function ellipsoid(out, c, rx, ry, rz, n, bias = 0.35) {
  for (let i = 0; i < n; i++) { const o = inSphere(1, bias); out.push(c[0] + o[0] * rx, c[1] + o[1] * ry, c[2] + o[2] * rz); }
}
function rotY(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c]; }
function rotX(p, a) { const c = Math.cos(a), s = Math.sin(a); return [p[0], p[1] * c - p[2] * s, p[1] * s + p[2] * c]; }

// Any point list -> exactly N points (random subset, or repeats with jitter)
function resample(arr) {
  const n = arr.length / 3, out = new Float32Array(N * 3);
  const idx = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = (rnd() * (i + 1)) | 0; [idx[i], idx[j]] = [idx[j], idx[i]]; }
  for (let i = 0; i < N; i++) {
    const j = idx[i % n], jit = i >= n ? 0.02 : 0;
    out[i * 3] = arr[j * 3] + gauss() * jit; out[i * 3 + 1] = arr[j * 3 + 1] + gauss() * jit; out[i * 3 + 2] = arr[j * 3 + 2] + gauss() * jit;
  }
  return out;
}

/* ---------------- shapes ---------------- */
function makeTree() {
  const p = [];
  for (let i = 0; i < 5200; i++) {
    const t = Math.pow(rnd(), 0.85), y = WATER + t * 1.5;
    const r = 0.08 + 0.2 * t * t * t + 0.26 * Math.pow(1 - t, 9);
    const ang = Math.floor(rnd() * 7) / 7 * TAU + t * 2.4 + gauss() * 0.35;
    const rr = r * (0.35 + 0.65 * Math.sqrt(rnd()));
    p.push(Math.cos(ang) * rr + Math.sin(t * 4) * 0.025, y, Math.sin(ang) * rr * 0.8);
  }
  const bez = (a, c, b, t) => { const u = 1 - t; return [0, 1, 2].map(k => u * u * a[k] + 2 * u * t * c[k] + t * t * b[k]); };
  const br = [];
  for (let b = 0; b < 9; b++) {
    const az = b / 9 * TAU + rnd() * 0.5, elev = 0.35 + rnd() * 0.6, len = 1.3 + rnd() * 0.7;
    const s = [Math.cos(az) * 0.1, -0.3 + rnd() * 0.15, Math.sin(az) * 0.07];
    const dx = Math.cos(az) * Math.cos(elev), dy = Math.sin(elev), dz = Math.sin(az) * Math.cos(elev) * 0.55;
    const e = [s[0] + dx * len * 1.3, s[1] + dy * len * 0.7 + 0.35, s[2] + dz * len];
    const c = [s[0] + dx * len * 0.2, s[1] + len * 0.55, s[2] + dz * len * 0.2];
    br.push({ s, c, e, r0: 0.07, r1: 0.025, len });
    for (let k = 0; k < 2; k++) {
      const q = bez(s, c, e, 0.45 + rnd() * 0.35), az2 = az + (k ? 1 : -1) * (0.5 + rnd() * 0.5), l2 = len * (0.4 + rnd() * 0.25);
      const e2 = [q[0] + Math.cos(az2) * l2, q[1] + l2 * (0.35 + rnd() * 0.3), q[2] + Math.sin(az2) * l2 * 0.5];
      br.push({ s: q, c: [lerp(q[0], e2[0], 0.3), lerp(q[1], e2[1], 0.75), lerp(q[2], e2[2], 0.3)], e: e2, r0: 0.035, r1: 0.015, len: l2 });
    }
  }
  const total = br.reduce((a, b) => a + b.len, 0);
  for (const b of br) {
    const n = Math.round(7000 * b.len / total);
    for (let i = 0; i < n; i++) {
      const t = rnd(), q = bez(b.s, b.c, b.e, t), o = inSphere(lerp(b.r0, b.r1, t), 0.5);
      p.push(q[0] + o[0], q[1] + o[1], q[2] + o[2]);
    }
    const big = b.r0 > 0.05, R = big ? 0.6 + rnd() * 0.35 : 0.42 + rnd() * 0.25;
    for (let i = 0, n2 = big ? 1700 : 850; i < n2; i++) p.push(b.e[0] + gauss() * R * 1.3, b.e[1] + gauss() * R * 0.75, b.e[2] + gauss() * R * 0.8);
  }
  const lump = (x, y, z) => 1 + 0.22 * Math.sin(x * 3.1 + 1.3) * Math.cos(z * 2.7) + 0.15 * Math.sin(y * 4.3 + x * 2.1);
  for (let i = 0; i < 11000; i++) {
    const d = inSphere(1, 0), len = Math.hypot(...d) || 1, dir = d.map(v => v / len);
    const r = Math.pow(rnd(), 0.4) * lump(...dir);
    p.push(dir[0] * 2.3 * r, 0.8 + dir[1] * 0.85 * r, dir[2] * 1.1 * r);
  }
  for (let i = 0; i < 3000; i++) p.push(gauss() * 1.0, 0.7 + gauss() * 0.55, gauss() * 0.6);
  for (let i = 0; i < 1800; i++) { const r = Math.pow(rnd(), 2.2) * 1.4, a = rnd() * TAU; p.push(Math.cos(a) * r, WATER + rnd() * 0.05, Math.sin(a) * r * 0.9); }
  for (let i = 0; i < 900; i++) p.push(gauss() * 0.28, WATER + Math.pow(rnd(), 1.5) * 1.6, gauss() * 0.2);
  return resample(p);
}

function makeSolar() {
  const p = [], tilt = 0.32, cy = 0.15;
  const put = q => { const r = rotX(q, tilt); p.push(r[0], r[1] + cy, r[2]); };
  for (let i = 0; i < 9000; i++) put(inSphere(0.48, 0.5));                     // sun
  for (let i = 0; i < 2500; i++) put(inSphere(0.75, 0.12).map(v => v));        // corona haze
  const orbits = [0.85, 1.15, 1.45, 1.8, 2.15, 2.45];
  const sizes = [0.06, 0.1, 0.11, 0.08, 0.2, 0.16];
  orbits.forEach((R, k) => {
    for (let i = 0; i < 1700; i++) { const a = rnd() * TAU, j = gauss() * 0.012; put([Math.cos(a) * (R + j), gauss() * 0.01, Math.sin(a) * (R + j)]); }
    const a = k * 1.9 + 0.6, c = [Math.cos(a) * R, 0, Math.sin(a) * R];
    for (let i = 0; i < 700 + sizes[k] * 6000; i++) { const o = inSphere(sizes[k], 0.4); put([c[0] + o[0], c[1] + o[1], c[2] + o[2]]); }
    if (k === 4) for (let i = 0; i < 1400; i++) { // saturn ring
      const ra = rnd() * TAU, rr = 0.3 + rnd() * 0.12; const q = rotX([Math.cos(ra) * rr, 0, Math.sin(ra) * rr], 0.5); put([c[0] + q[0], c[1] + q[1], c[2] + q[2]]);
    }
  });
  for (let i = 0; i < 2500; i++) { const a = rnd() * TAU, r = 1.98 + gauss() * 0.06; put([Math.cos(a) * r, gauss() * 0.04, Math.sin(a) * r]); } // asteroid belt
  return resample(p);
}

// capsule whose radius tapers from r0 to r1
function taper(out, a, b, r0, r1, n, bias = 0.4) {
  for (let i = 0; i < n; i++) {
    const t = rnd(), o = inSphere(lerp(r0, r1, t), bias);
    out.push(lerp(a[0], b[0], t) + o[0], lerp(a[1], b[1], t) + o[1], lerp(a[2], b[2], t) + o[2]);
  }
}
// chain of tapered segments through points
function limb(out, pts, r0, r1, n) {
  const segs = pts.length - 1;
  for (let s = 0; s < segs; s++) taper(out, pts[s], pts[s + 1], lerp(r0, r1, s / segs), lerp(r0, r1, (s + 1) / segs), Math.round(n / segs));
}

function makeHand() {
  // open relaxed palm facing the viewer, thumb on the left, fingers fanning and curling slightly forward
  const p = [];
  // short, dense wrist ending in a soft cuff (the hand floats above the water)
  for (let i = 0; i < 9000; i++) {
    const t = rnd(), a = rnd() * TAU, r = Math.pow(rnd(), 0.35);
    const w = lerp(0.5, 0.58, t);
    p.push(lerp(-0.06, 0.0, t) + Math.cos(a) * w * r, lerp(-1.1, -0.6, t), Math.sin(a) * 0.36 * r);
  }
  for (let i = 0; i < 1200; i++) {                                              // dots loosening at the cuff edge
    const a = rnd() * TAU, r = Math.pow(rnd(), 0.5) * 0.55;
    p.push(-0.06 + Math.cos(a) * r, -1.1 - Math.pow(rnd(), 2) * 0.3, Math.sin(a) * r * 0.65);
  }
  // palm: quad between the wrist line and the slanted knuckle line, slightly cupped
  const BL = [-0.574, -0.66], BR = [0.596, -0.596], TL = [-0.447, 0.128], TR = [0.617, -0.191];
  for (let i = 0; i < 13000; i++) {
    const u = rnd(), v = rnd();
    const x = lerp(lerp(BL[0], BR[0], u), lerp(TL[0], TR[0], u), v);
    const y = lerp(lerp(BL[1], BR[1], u), lerp(TL[1], TR[1], u), v);
    const edge = Math.abs(u - 0.5) * 2;
    p.push(x, y, gauss() * 0.24 + edge * edge * 0.08);
  }
  ellipsoid(p, [-0.6, -0.34, 0.06], 0.32, 0.3, 0.26, 4500, 0.34);                    // thumb mound
  ellipsoid(p, [0.46, -0.4, 0.04], 0.24, 0.3, 0.22, 2800, 0.34);                     // outer palm edge
  // fingers: index, middle, ring, pinky  [base, tip, radius]
  const F = [
    [[-0.31, 0.106], [-0.27, 0.94], 0.15],
    [[-0.0, 0.075], [0.06, 0.86], 0.15],
    [[0.28, 0.02], [0.43, 0.63], 0.145],
    [[0.52, -0.15], [0.66, 0.4], 0.13],
  ];
  for (const [b, t, r] of F) {
    const m = [lerp(b[0], t[0], 0.5), lerp(b[1], t[1], 0.5), 0.06];
    limb(p, [[b[0], b[1], 0], m, [t[0], t[1], 0.17]], r, r * 0.85, 4800);
  }
  limb(p, [[-0.7, -0.4, 0.05], [-0.81, 0.0, 0.1], [-0.766, 0.298, 0.18]], 0.2, 0.16, 5200); // thumb
  return resample(p.map((v, i) => i % 3 === 1 ? (v - WATER) * 1.32 + WATER : v * 1.32));
}

function makeHuman() {
  // seated on the floor: one knee up with the arm resting on it, the other leg folded in front
  const p = [], F = WATER + 0.05;
  ellipsoid(p, [0, 0.42, 0], 0.22, 0.28, 0.24, 5000, 0.34);                      // head
  ellipsoid(p, [0, 0.2, 0.1], 0.17, 0.19, 0.13, 2000, 0.34);                     // beard
  taper(p, [0, -0.05, 0], [0, 0.22, 0], 0.13, 0.12, 1800, 0.34);                 // neck
  for (let i = 0; i < 16000; i++) {                                              // torso, leaning slightly forward
    const t = rnd(), y = F + 0.35 + t * (0.02 - (F + 0.35)), w = lerp(0.36, 0.5, Math.pow(t, 0.8)), a = rnd() * TAU, r = Math.pow(rnd(), 0.34);
    p.push(Math.cos(a) * w * r, y, -0.1 + t * 0.06 + Math.sin(a) * 0.28 * r);
  }
  ellipsoid(p, [0, -0.3, 0.02], 0.42, 0.28, 0.27, 3500, 0.34);                    // chest
  for (const sx of [-1, 1]) ellipsoid(p, [sx * 0.46, -0.1, -0.03], 0.16, 0.15, 0.16, 1600, 0.34); // shoulders
  ellipsoid(p, [0, F + 0.24, -0.05], 0.44, 0.24, 0.32, 3200, 0.34);              // hips on the floor
  // raised leg (right side of the image)
  limb(p, [[0.2, F + 0.22, 0.05], [0.58, -0.5, 0.45]], 0.2, 0.16, 5200);          // thigh up to the knee
  limb(p, [[0.58, -0.5, 0.45], [0.7, F + 0.1, 0.55]], 0.15, 0.11, 4000);          // shin down
  limb(p, [[0.68, F + 0.05, 0.5], [0.88, F + 0.02, 0.84]], 0.11, 0.1, 1500);      // shoe
  // folded leg lying on the floor (left side), shin crossing in front
  limb(p, [[-0.2, F + 0.17, 0.05], [-0.95, F + 0.14, 0.42]], 0.2, 0.16, 4800);    // thigh out to the knee
  limb(p, [[-0.95, F + 0.14, 0.42], [0.05, F + 0.12, 0.85]], 0.15, 0.11, 4200);   // shin across
  limb(p, [[0.05, F + 0.1, 0.85], [0.24, F + 0.22, 1.06]], 0.11, 0.1, 1500);      // shoe
  // arm resting on the raised knee, hand drooping
  limb(p, [[0.46, -0.1, -0.02], [0.62, -0.42, 0.42]], 0.13, 0.11, 3200);          // upper arm
  limb(p, [[0.62, -0.42, 0.42], [0.05, -0.5, 0.55]], 0.11, 0.09, 3000);           // forearm across the knee
  limb(p, [[0.05, -0.5, 0.55], [-0.02, -0.8, 0.55]], 0.085, 0.065, 1100);         // hand
  // other arm reaching down, hand on the floor
  limb(p, [[-0.46, -0.1, -0.02], [-0.62, -0.85, 0.05]], 0.13, 0.11, 3200);
  limb(p, [[-0.62, -0.85, 0.05], [-0.62, F + 0.1, 0.22]], 0.11, 0.085, 2800);
  ellipsoid(p, [-0.6, F + 0.05, 0.3], 0.1, 0.06, 0.14, 800, 0.34);
  return resample(p.map((v, i) => i % 3 === 1 ? (v - WATER) * 1.4 + WATER : v * 1.4));
}

function makeBox() {
  const p = [], S = 1.05, ay = 0.62, ax = 0.42, cy = 0.15;
  const put = q => { const r = rotX(rotY(q, ay), ax); p.push(r[0], r[1] + cy, r[2]); };
  const corners = [];
  for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) corners.push([x * S, y * S, z * S]);
  const edges = [];
  for (let i = 0; i < 8; i++) for (let j = i + 1; j < 8; j++) {
    const d = corners[i].reduce((a, v, k) => a + (v !== corners[j][k] ? 1 : 0), 0);
    if (d === 1) edges.push([corners[i], corners[j]]);
  }
  for (const [a, b] of edges) for (let i = 0; i < 1500; i++) { const t = rnd(), o = inSphere(0.035, 0.6); put([lerp(a[0], b[0], t) + o[0], lerp(a[1], b[1], t) + o[1], lerp(a[2], b[2], t) + o[2]]); }
  for (let i = 0; i < 14000; i++) {                                              // faces
    const f = (rnd() * 3) | 0, sgn = rnd() < 0.5 ? -1 : 1, q = [(rnd() * 2 - 1) * S, (rnd() * 2 - 1) * S, (rnd() * 2 - 1) * S];
    q[f] = sgn * S + gauss() * 0.02; put(q);
  }
  for (let i = 0; i < 6000; i++) put([(rnd() * 2 - 1) * S * 0.95, (rnd() * 2 - 1) * S * 0.95, (rnd() * 2 - 1) * S * 0.95]); // inner dust
  ellipsoid(p, [0, cy, 0], 0.35, 0.35, 0.35, 2500, 0.6);                         // glowing core
  return resample(p);
}

function makeTriangles() {
  // Sierpinski tetrahedron: a pyramid made of many smaller triangles
  const p = [], H = 3.1, cy = -1.25;
  // apex and base centroid both sit on the y axis, so the pyramid spins in place with its tip dead centre
  const v = [[0, H, 0], [-1.75, 0, -1.0], [1.75, 0, -1.0], [0, 0, 2.0]].map(q => rotY(q, 0.5));
  let q = [0, 1, 0];
  for (let i = 0; i < 30000; i++) {
    const k = v[(rnd() * 4) | 0];
    q = [(q[0] + k[0]) / 2, (q[1] + k[1]) / 2, (q[2] + k[2]) / 2];
    if (i > 20) p.push(q[0], q[1] + cy, q[2]);
  }
  // bright outline edges
  for (let i = 0; i < 4; i++) for (let j = i + 1; j < 4; j++) for (let n = 0; n < 1600; n++) {
    const t = rnd(), a = v[i], b = v[j];
    p.push(lerp(a[0], b[0], t) + gauss() * 0.02, lerp(a[1], b[1], t) + cy + gauss() * 0.02, lerp(a[2], b[2], t) + gauss() * 0.02);
  }
  return resample(p);
}

function makeSphere() {
  const p = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { const o = inSphere(1.3, 0.18); p[i * 3] = o[0]; p[i * 3 + 1] = o[1] + 0.25; p[i * 3 + 2] = o[2]; }
  return p;
}

}

const fromAttr = new THREE.BufferAttribute(REDUCED ? SPHERE : makeOffscreen(), 3).setUsage(THREE.DynamicDrawUsage);

const uniforms = {
  uTime: { value: 0 },
  uMorph: { value: REDUCED ? 1 : 0 },
  uScale: { value: 1 },
  uMouse: { value: new THREE.Vector3(99, 99, 0) },
  uMouseStrength: { value: 0 },
  uRadius: { value: 0.17 },
  uWater: { value: WATER },
  uFocus: { value: 6.6 },
  uStagger: { value: REDUCED ? 0.41 : 0.7 },
  uSwirl: { value: REDUCED ? 0.7 : 0.45 },
};

const treeVert = /* glsl */`
  uniform float uTime, uMorph, uScale, uMouseStrength, uRadius, uWater, uMirror, uFocus, uStagger, uSwirl;
  uniform vec3 uMouse;
  attribute vec3 aFrom; attribute vec4 aRand;
  varying vec3 vColor; varying float vAlpha;
  void main() {
    float m = clamp((uMorph - aRand.z * uStagger) / (1.0 - uStagger), 0.0, 1.0); // per-dot start delay
    m = m * m * (3.0 - 2.0 * m);
    float ph = aRand.y * 6.2831;
    vec3 shimmer = vec3(sin(uTime * 0.9 + ph), cos(uTime * 0.7 + ph * 1.3), sin(uTime * 0.8 + ph * 0.7)) * 0.016;

    vec3 a = aFrom + shimmer, b = position + shimmer;
    float h = clamp((b.y - uWater) / 3.6, 0.0, 1.0);
    b.x += sin(uTime * 0.6 + b.y * 0.9) * 0.05 * h * h;

    vec3 p = mix(a, b, m);
    vec3 n = normalize(vec3(sin(aRand.y * 91.0), cos(aRand.w * 57.0), sin(aRand.x * 33.0)) + 1e-4);
    p += n * sin(m * 3.14159) * uSwirl;

    // work in world space so the cursor lines up even while the shape turns
    vec4 wp = modelMatrix * vec4(p, 1.0);

    // cursor repulsion
    vec2 dv = wp.xy - uMouse.xy;
    float d = length(dv);
    float f = smoothstep(uRadius, 0.0, d) * uMouseStrength;
    wp.xy += (dv / max(d, 1e-3)) * f * 0.1;
    wp.z += f * (aRand.w - 0.5) * 0.15;

    // soft key light from the upper right/front (where the light beams come from)
    vec3 rel = wp.xyz - vec3(0.0, 0.1, 0.0);
    float lit = dot(normalize(rel + 1e-4), normalize(vec3(0.55, 0.6, 0.6))) * 0.5 + 0.5;

    float tw = 0.6 + 0.4 * sin(uTime * 2.2 + aRand.y * 40.0);
    float alpha = tw;
    if (uMirror > 0.5) {
      float depth = max(wp.y - uWater, 0.0);
      wp.y = uWater - depth;
      wp.x += sin(wp.y * 9.0 + uTime * 1.6) * 0.025 * min(depth, 1.0);
      alpha *= 0.16 * exp(-depth * 0.8);
    }

    vec4 mv = viewMatrix * wp;
    gl_Position = projectionMatrix * mv;

    // depth cues: near dots bigger + brighter, far dots dimmer and soft like out-of-focus bokeh
    float dz = -mv.z - uFocus;                 // < 0 in front of the focal plane
    float nearness = clamp(-dz / 1.4, -1.0, 1.0);
    float blur = min(abs(dz) * 0.35, 1.2);

    // silver glitter with a lavender cast; a few big sparkles
    float sparkle = step(0.965, aRand.x);
    float size = 0.0135 * (0.5 + aRand.x * aRand.x * 1.6) * (1.0 + sparkle * 1.8) * (1.0 + f * 0.6);
    size *= (1.0 + nearness * 0.25) * (1.0 + blur * 0.7);
    gl_PointSize = max(size * uScale / -mv.z, 1.0);
    vec3 silver = vec3(0.86, 0.88, 0.95), lav = vec3(0.74, 0.62, 1.0);
    float lv = clamp(aRand.w * 0.8 + (wp.y - 0.4) * 0.25 + (1.0 - lit) * 0.4, 0.0, 1.0);
    float shade = (0.66 + nearness * 0.26) * (0.55 + lit * 0.75);
    vColor = mix(silver, lav, lv * 0.75) * (0.5 + sparkle * 0.5) * shade * (1.0 + f * 1.2);
    vAlpha = alpha / (1.0 + blur * 2.2);
  }`;
const pointFrag = /* glsl */`
  varying vec3 vColor; varying float vAlpha;
  void main() {
    float d = length(gl_PointCoord - 0.5);
    if (d > 0.5) discard;
    float a = smoothstep(0.5, 0.0, d);
    a = a * a * 1.6 * vAlpha;
    gl_FragColor = vec4(vColor * a, 0.0); // pure light: never darkens the page behind
  }`;

function pointsMaterial(mirror) {

    uniforms: { ...uniforms, uMirror: { value: mirror } },
    vertexShader: treeVert, fragmentShader: pointFrag,
    transparent: true, depthWrite: false, ...ADD,
  });
}

/* ---------------- floor with soft contour ripples ---------------- */
const MAX_RIP = 6;
const ripples = Array.from({ length: MAX_RIP }, () => new THREE.Vector3(0, 0, -100));
const waterMat = new THREE.ShaderMaterial({
  uniforms: { uTime: uniforms.uTime, uRip: { value: ripples } },
  transparent: true, depthWrite: false, ...ADD,
  vertexShader: /* glsl */`
    varying vec3 vW;
    void main() { vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
  fragmentShader: /* glsl */`
    uniform float uTime; uniform vec3 uRip[${MAX_RIP}];
    varying vec3 vW;
    float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
    }
    float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; } return v; }
    void main() {
      vec2 p = vW.xz;
      float r = length(p);
      float warp = fbm(p * 0.55 + vec2(uTime * 0.04, -uTime * 0.03));
      float d = r + (warp - 0.5) * 1.5;
      float ph = fract(d * 1.25 - uTime * 0.18);
      float ring = smoothstep(0.05, 0.0, abs(ph - 0.5)) * 0.2 + smoothstep(0.25, 0.0, abs(ph - 0.5)) * 0.06;
      float fade = exp(-r * 0.22) * smoothstep(0.0, 0.6, r);
      vec3 col = vec3(0.78, 0.76, 0.95) * ring * fade;
      col += vec3(0.7, 0.65, 0.95) * exp(-r * 1.6) * 0.22;
      for (int i = 0; i < ${MAX_RIP}; i++) {
        float age = uTime - uRip[i].z;
        if (age < 0.0 || age > 4.0) continue;
        float rd = length(p - uRip[i].xy);
        float w = smoothstep(0.06, 0.0, abs(rd - age * 0.9)) + 0.5 * smoothstep(0.05, 0.0, abs(rd - age * 0.9 + 0.25));
        col += vec3(0.85, 0.8, 1.0) * w * exp(-age * 1.1) * 0.5;
      }
      gl_FragColor = vec4(col, 0.0);
    }`,
});

function attachDots(btn) {
  const c = document.createElement("canvas");
  c.setAttribute("aria-hidden", "true");
  btn.prepend(c);
  const ctx = c.getContext("2d");
  const dots = Array.from({ length: 80 }, () => ({ x: rnd(), y: rnd(), z: 0.3 + rnd() * 0.7, r: 0.5 + rnd() * 1.1, ph: rnd() * TAU }));
  let w = 0, h = 0, dpr = 1, mx = 0.5, my = 0.5, tx = 0.5, ty = 0.5, a = 0, ta = 0, raf = 0;
  const size = () => {
    const r = btn.getBoundingClientRect();
    dpr = Math.min(devicePixelRatio, 2); w = r.width; h = r.height;
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
  };
  const move = e => {
    const r = btn.getBoundingClientRect();
    tx = (e.clientX - r.left) / r.width; ty = (e.clientY - r.top) / r.height;
  };
  const loop = t => {
    const k = REDUCED ? 1 : 0.12;
    mx += (tx - mx) * k; my += (ty - my) * k; a += (ta - a) * 0.1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    const g = ctx.createRadialGradient(mx * w, my * h, 0, mx * w, my * h, w * 0.45);
    g.addColorStop(0, `rgba(255,255,255,${0.12 * a})`); g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const sigma = w * 0.3, drift = REDUCED ? 0 : 1;
    for (const d of dots) {
      // each dot drifts gently and shifts with the cursor (nearer dots shift more)
      const px = (d.x + Math.sin(t * 0.0006 + d.ph) * 0.02 * drift + (mx - 0.5) * 0.14 * d.z) * w;
      const py = (d.y + Math.cos(t * 0.0008 + d.ph) * 0.06 * drift + (my - 0.5) * 0.2 * d.z) * h;
      const dx = px - mx * w, dy = (py - my * h) * 1.6;
      const vis = Math.exp(-(dx * dx + dy * dy) / (2 * sigma * sigma));
      const al = a * vis * (0.55 + 0.45 * Math.sin(t * 0.003 + d.ph * 3));
      if (al < 0.01) continue;
      ctx.fillStyle = `rgba(228,230,248,${al.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(px, py, d.r * d.z + 0.35, 0, TAU); ctx.fill();
    }
    if (ta === 0 && a < 0.01) { ctx.clearRect(0, 0, w, h); raf = 0; return; }
    raf = requestAnimationFrame(loop);
  };
  btn.addEventListener("pointerenter", e => { if (btn.classList.contains("on")) return; size(); move(e); mx = tx; my = ty; ta = 1; if (!raf) raf = requestAnimationFrame(loop); });
  btn.addEventListener("pointermove", move);
  btn.addEventListener("pointerleave", () => { ta = 0; });
  btn.addEventListener("click", () => { ta = 0; }); // a selected (white) tag hides its dots
}
document.querySelectorAll(".btn-line").forEach(attachDots);

/* ---------------- shape switching ---------------- */
let current = 0, morphStart = REDUCED ? -10 : 0.1, morphDur = REDUCED ? 0.01 : 2.2;
let introDone = REDUCED;
if (REDUCED) hero.classList.remove("loading");
const dotsEl = document.getElementById("dots"), tagsEl = document.getElementById("tags");
dotsEl.innerHTML = SHAPES.map((sh, i) => `<button type="button" role="tab" aria-label="${sh.label}" data-i="${i}"></button>`).join("");
tagsEl.innerHTML = SHAPES.map((sh, i) => `<button type="button" data-i="${i}">${sh.label}</button>`).join("");
[...tagsEl.children].forEach(attachDots);
/* side words: letters slide out from behind the anchor letter (first on the left, last on the right) */
const wordEls = [document.getElementById("wordL"), document.getElementById("wordR")];
const EASE_OUT = "cubic-bezier(.2, .8, .2, 1)", EASE_IN = "cubic-bezier(.6, 0, .8, .2)";
function letterPlan(el, k) {
  const letters = [...el.children];
  const anchor = k === 0 ? letters[0] : letters[letters.length - 1];
  return letters.map((l, i) => ({
    l,
    dx: anchor.offsetLeft - l.offsetLeft,                  // distance back to the anchor letter
    rank: k === 0 ? i : letters.length - 1 - i,            // 0 = anchor, then outward
  }));
}
function enterWord(el, k, text) {
  el.setAttribute("aria-label", text);
  el.innerHTML = [...text].map(c => `<span class="lt" aria-hidden="true">${c}</span>`).join("");
  if (REDUCED) return Promise.resolve();
  return Promise.all(letterPlan(el, k).map(({ l, dx, rank }) => {
    l.style.zIndex = 50 - rank;                             // the anchor stays on top so letters emerge from behind it
    l.style.position = "relative";
    return l.animate(
      [{ transform: `translateX(${dx}px)`, opacity: 0 }, { transform: "translateX(0)", opacity: 1 }],
      { duration: rank ? 650 : 400, delay: rank * 75, easing: EASE_OUT, fill: "backwards" }
    ).finished;
  }));
}
function exitWord(el, k) {
  if (REDUCED || !el.children.length) return Promise.resolve();
  const plan = letterPlan(el, k), last = plan.length - 1;
  return Promise.all(plan.map(({ l, dx, rank }) => l.animate(
    [{ transform: "translateX(0)", opacity: 1 }, { transform: `translateX(${dx}px)`, opacity: 0 }],
    // outermost letters tuck in first, the anchor fades last
    { duration: rank ? 420 : 260, delay: rank ? (last - rank) * 40 : last * 40 + 120, easing: EASE_IN, fill: "forwards" }
  ).finished));
}
let wordToken = 0;
async function swapWords() {
  const token = ++wordToken;
  await Promise.all(wordEls.map((el, k) => exitWord(el, k)));
  if (token !== wordToken) return;
  wordEls.forEach((el, k) => enterWord(el, k, SHAPES[current].words[k]));
}
function showFirstWords() { wordEls.forEach((el, k) => enterWord(el, k, SHAPES[current].words[k])); }
if (REDUCED) showFirstWords();
function updateUI() {
  for (const el of [...dotsEl.children, ...tagsEl.children]) {
    const on = +el.dataset.i === current;
    el.classList.toggle("on", on);
    el.setAttribute(el.getAttribute("role") === "tab" ? "aria-selected" : "aria-pressed", on);
  }
}
updateUI();

function goTo(i) {
  if (!introDone || i === current || uniforms.uMorph.value < 0.92) return; // let the current morph settle
  fromAttr.array.set(toAttr.array);                          // start from where we are now
  current = i;
  toAttr.array.set(SHAPES[current].data);
  fromAttr.needsUpdate = toAttr.needsUpdate = true;
  uniforms.uMorph.value = 0;
  morphStart = uniforms.uTime.value; morphDur = REDUCED ? 0.01 : 2.2;
  updateUI();
  swapWords();
}
hero.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const pick = e.target.closest("[data-i]");
  if (pick) return goTo(+pick.dataset.i);
  if (e.target.closest("nav, .shape-ui, .tags")) return; // near-misses on the controls never skip ahead
  goTo((current + 1) % SHAPES.length);
});

/* ---------------- pointer ---------------- */
const ndc = new THREE.Vector2(9, 9);
const mouseTarget = new THREE.Vector3(99, 99, 0);
let pointerIn = false, lastRip = 0, ripIdx = 0;
const ray = new THREE.Raycaster();
const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
const planeW = new THREE.Plane(new THREE.Vector3(0, 1, 0), -WATER);
const hit = new THREE.Vector3();
const cursor = document.getElementById("cursor"), dot = document.getElementById("cursorDot");
let cx = 0, cy = 0, rx = 0, ry = 0;

hero.addEventListener("pointermove", e => {
  const rect = canvas.getBoundingClientRect();
  ndc.set(((e.clientX - rect.left) / rect.width) * 2 - 1, -((e.clientY - rect.top) / rect.height) * 2 + 1);
  pointerIn = true;
  cx = e.clientX; cy = e.clientY;
  dot.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
  ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(planeZ, hit)) mouseTarget.copy(hit);
  if (ray.ray.intersectPlane(planeW, hit) && hit.length() < 9 && uniforms.uTime.value - lastRip > 0.28) {
    ripples[ripIdx].set(hit.x, hit.z, uniforms.uTime.value);
    ripIdx = (ripIdx + 1) % MAX_RIP;
    lastRip = uniforms.uTime.value;
  }
});
hero.addEventListener("pointerleave", () => { pointerIn = false; });
document.querySelectorAll(".hero a, .hero button").forEach(el => {
  el.addEventListener("pointerenter", () => cursor.classList.add("big"));
  el.addEventListener("pointerleave", () => cursor.classList.remove("big"));
});

/* ---------------- resize ---------------- */
let narrow = false;
function resize() {
  const w = hero.clientWidth, h = hero.clientHeight;
  const dpr = Math.min(devicePixelRatio, 2);
  renderer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  narrow = camera.aspect < 1;
  // portrait: fit the shape's width, and on tablets also its height (so tall shapes never hide under the nav)
  const tan = 2 * Math.tan(THREE.MathUtils.degToRad(20));
  const fit = narrow ? Math.max(4.3 / (tan * camera.aspect), 7.0 / tan) : 6.6;
  camera.userData.z = Math.max(6.6, fit);
  camera.updateProjectionMatrix();
  uniforms.uScale.value = (h * dpr) / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
}
addEventListener("resize", resize);
resize();

/* ---------------- loop ---------------- */
const clock = new THREE.Clock();
const focusPt = new THREE.Vector3(0, 0.1, 0);
let running = true;
document.addEventListener("visibilitychange", () => { running = !document.hidden; if (running) { clock.getDelta(); tick(); } });
let nextAmbient = 1.5, turn = 0, spinMix = REDUCED ? 1 : 0;
const AUTO_HOLD = 3;   // seconds each finished shape stays before the next one
let holdStart = -1;

function tick() {
  if (!running) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = (uniforms.uTime.value += dt * (REDUCED ? 0.35 : 1));

  uniforms.uMorph.value = THREE.MathUtils.clamp((t - morphStart) / morphDur, 0, 1);

  // auto-advance: once a shape has fully formed, hold it, then move to the next
  if (introDone && !REDUCED) {
    if (uniforms.uMorph.value < 1) holdStart = -1;
    else if (holdStart < 0) holdStart = t;
    else if (t - holdStart >= AUTO_HOLD) { holdStart = -1; goTo((current + 1) % SHAPES.length); }
  }
  if (!introDone) {
    if (uniforms.uMorph.value >= 1 && t > morphStart + morphDur + 0.15) {
      // sphere assembled: reveal the page and grow the first shape
      introDone = true;
      hero.classList.remove("loading");
      setTimeout(showFirstWords, 700);
      fromAttr.array.set(SPHERE); toAttr.array.set(SHAPES[0].data);
      fromAttr.needsUpdate = toAttr.needsUpdate = true;
      uniforms.uStagger.value = 0.41; uniforms.uSwirl.value = 0.7;
      uniforms.uMorph.value = 0;
      morphStart = t + 0.2; morphDur = 2.6;
    }
  }

  if (t > nextAmbient) {
    ripples[ripIdx].set((rnd() - 0.5) * 0.3, (rnd() - 0.5) * 0.3, t);
    ripIdx = (ripIdx + 1) % MAX_RIP;
    nextAmbient = t + 2.4 + rnd() * 1.5;
  }

  uniforms.uMouse.value.lerp(mouseTarget, 1 - Math.pow(0.0008, dt));
  const targetStrength = pointerIn && introDone && uniforms.uMorph.value > 0.6 ? 1 : 0;
  uniforms.uMouseStrength.value += (targetStrength - uniforms.uMouseStrength.value) * (1 - Math.pow(0.02, dt));

  // slow turn so every shape reads as 3D
  // slow turn plus a turn toward the cursor so every shape reads as 3D
  turn += ((pointerIn ? ndc.x * 0.55 : 0) - turn) * (1 - Math.pow(0.15, dt));
  spinMix += ((introDone ? 1 : 0) - spinMix) * (1 - Math.pow(0.3, dt));
  shapeGroup.rotation.y = (Math.sin(t * 0.16) * 0.55 + turn) * spinMix;

  const px = pointerIn ? ndc.x : 0, py = pointerIn ? ndc.y : 0;
  camera.position.x += (px * 0.35 - camera.position.x) * 0.04;
  camera.position.y += ((narrow ? -0.5 : 0.55) + py * 0.15 - camera.position.y) * 0.04;
  camera.position.z = camera.userData.z;
  camera.lookAt(0, narrow ? -1.1 : 0.0, 0);

  rx += (cx - rx) * 0.18; ry += (cy - ry) * 0.18;
  cursor.style.transform = `translate(${rx}px, ${ry}px) translate(-50%, -50%)`;

  uniforms.uFocus.value = camera.position.distanceTo(focusPt);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
